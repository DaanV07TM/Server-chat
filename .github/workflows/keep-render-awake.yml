name: Keep Render chat awake

on:
  # Manual only: let free Render services sleep while idle.
  # Use Actions -> Keep Render chat awake -> Run workflow for a one-off health check.
  workflow_dispatch:

jobs:
  keep-awake:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Ping the Render health endpoint
        env:
          RENDER_URL: ${{ vars.RENDER_URL }}
        run: |
          if [ -z "$RENDER_URL" ]; then
            echo "::error::Add a repository variable named RENDER_URL with your public Render service URL."
            exit 1
          fi

          URL="${RENDER_URL%/}/healthz"
          echo "Checking Render service: $URL"
          curl --fail --silent --show-error --connect-timeout 10 --max-time 90 "$URL"
          echo
