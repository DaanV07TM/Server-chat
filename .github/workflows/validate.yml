name: Validate application

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate server and service worker syntax
        run: |
          node --check server.js
          node --check public/sw.js
          node --check public/ai.js
      - name: Validate inline browser JavaScript
        shell: bash
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path
          html = Path("public/index.html").read_text(encoding="utf-8")
          scripts = re.findall(r'<script\b(?![^>]*\bsrc=)[^>]*>(.*?)</script\s*>', html, flags=re.I | re.S)
          if not scripts:
              raise SystemExit("No inline JavaScript block was found.")
          Path("/tmp/server-chat-inline.js").write_text("\n".join(scripts), encoding="utf-8")
          PY
          node --check /tmp/server-chat-inline.js
      - name: Validate temporary account wiring
        run: |
          python3 - <<'PY'
          from pathlib import Path
          server = Path("server.js").read_text(encoding="utf-8")
          html = Path("public/index.html").read_text(encoding="utf-8")
          css = Path("public/accounts.css").read_text(encoding="utf-8")
          for marker in ("socket.on('auth:register'", "socket.on('auth:login'", "socket.on('auth:resume'", "socket.on('auth:logout'", "socket.on('auth:change-password'", "socket.on('auth:delete-account'", "socket.use((packet, next)", "generatedPassword = crypto.randomBytes(18).toString('base64url')", "addedByToken: key()", "reporters: []"):
              if marker not in server:
                  raise SystemExit(f"Missing server account control: {marker}")
          for marker in ("function adminPasswordMatches(password)", "if (adminPasswordMatches(password))", "isAdmin: true"):
              if marker not in server:
                  raise SystemExit(f"Missing standard-form admin password login: {marker}")
          if 'id="authTabAdmin"' in html or 'id="authAdminPassword"' in html:
              raise SystemExit("The login UI must not display a separate admin option.")
          if "if (data.isAdmin === true)" not in html:
              raise SystemExit("The normal login response must handle an admin session without creating an account.")
          for marker in ("app.get('/api/ai/conversations'", "app.post('/api/ai/conversations'", "app.post('/api/ai/chat'", "app.post('/api/ai/conversations/:id/share'", "AI_PUBLIC_SHARES.delete(shareId)"):
              if marker not in server:
                  raise SystemExit(f"Missing private AI endpoint or deletion control: {marker}")
          for marker in ('id="authGate"', 'id="authForm"', 'id="authCreateInfo"', 'id="generatedCredentials"', 'id="copyGeneratedCredentials"', 'id="accountSettings"', 'id="changePasswordForm"', 'id="deleteAccountButton"', 'id="logoutBtn"', 'id="accountName"', 'data-channel="ai"', 'const isSharedAIView', "server-chat:account-ready"):
              if marker not in html:
                  raise SystemExit(f"Missing account or AI UI control: {marker}")
          for marker in (".auth-card", "#channelNav", ".account-chip", ".credentials-card", ".settings-danger", "#siteDialog"):
              if marker not in css:
                  raise SystemExit(f"Missing account/workspace style: {marker}")
          ai_css = Path("public/ai.css").read_text(encoding="utf-8")
          ai_js = Path("public/ai.js").read_text(encoding="utf-8")
          for marker in (".ai-workspace", 'body[data-room="ai"]', ".ai-share-banner"):
              if marker not in ai_css:
                  raise SystemExit(f"Missing AI Studio style: {marker}")
          for marker in ("api('/api/ai/conversations'", "api('/api/ai/share/'", 'https://www.bing.com/images/create', 'id="aiImageLink"', "server-chat:account-ready"):
              if marker not in ai_js:
                  raise SystemExit(f"Missing AI Studio client feature: {marker}")
          if "POLLINATIONS_API_KEY" in server or "app.post('/api/ai/image'" in server or "api('/api/ai/image'" in ai_js:
              raise SystemExit("Built-in AI image-generation API must remain removed; use the external generator link.")
          if "localStorage.setItem('generatedPassword'" in html or "localStorage.setItem('newPassword'" in html:
              raise SystemExit("Plaintext generated passwords must never be saved to browser storage.")
          PY
      - name: Validate web app manifest
        run: node -e "JSON.parse(require('node:fs').readFileSync('public/manifest.webmanifest', 'utf8'))"
