name: Validate application

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate server and service worker syntax
        run: |
          node --check server.js
          node --check public/sw.js
          node --check public/ai.js
          node --check public/status.js
      - name: Validate inline browser JavaScript
        shell: bash
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path
          html = Path("public/index.html").read_text(encoding="utf-8")
          scripts = re.findall(r'<script\b(?![^>]*\bsrc=)[^>]*>(.*?)</script\s*>', html, flags=re.I | re.S)
          if not scripts:
              raise SystemExit("No inline JavaScript block was found.")
          Path("/tmp/server-chat-inline.js").write_text("\n".join(scripts), encoding="utf-8")
          PY
          node --check /tmp/server-chat-inline.js
      - name: Validate temporary account wiring
        run: |
          python3 - <<'PY'
          from pathlib import Path
          server = Path("server.js").read_text(encoding="utf-8")
          html = Path("public/index.html").read_text(encoding="utf-8")
          css = Path("public/accounts.css").read_text(encoding="utf-8")
          for marker in ("socket.on('auth:register'", "socket.on('auth:login'", "socket.on('auth:resume'", "socket.on('auth:logout'", "socket.on('auth:change-password'", "socket.on('auth:delete-account'", "socket.use((packet, next)", "generatedPassword = crypto.randomBytes(18).toString('base64url')", "addedByToken: key()", "reporters: []"):
              if marker not in server:
                  raise SystemExit(f"Missing server account control: {marker}")
          for marker in ("function adminPasswordMatches(password)", "if (adminPasswordMatches(password))", "isAdmin: true"):
              if marker not in server:
                  raise SystemExit(f"Missing standard-form admin password login: {marker}")
          if 'id="authTabAdmin"' in html or 'id="authAdminPassword"' in html:
              raise SystemExit("The login UI must not display a separate admin option.")
          if "if (data.isAdmin === true)" not in html:
              raise SystemExit("The normal login response must handle an admin session without creating an account.")
          for marker in ("app.get('/api/ai/conversations'", "app.post('/api/ai/conversations'", "app.post('/api/ai/chat'", "app.post('/api/ai/conversations/:id/share'", "AI_PUBLIC_SHARES.delete(shareId)"):
              if marker not in server:
                  raise SystemExit(f"Missing private AI endpoint or deletion control: {marker}")
          for marker in ('id="authGate"', 'id="authForm"', 'id="authCreateInfo"', 'id="generatedCredentials"', 'id="copyGeneratedCredentials"', 'id="accountSettings"', 'id="changePasswordForm"', 'id="deleteAccountButton"', 'id="logoutBtn"', 'id="accountName"', 'data-channel="ai"', 'const isSharedAIView', "server-chat:account-ready"):
              if marker not in html:
                  raise SystemExit(f"Missing account or AI UI control: {marker}")
          for marker in (".auth-card", "#channelNav", ".account-chip", ".credentials-card", ".settings-danger", "#siteDialog"):
              if marker not in css:
                  raise SystemExit(f"Missing account/workspace style: {marker}")
          ai_css = Path("public/ai.css").read_text(encoding="utf-8")
          ai_js = Path("public/ai.js").read_text(encoding="utf-8")
          for marker in (".ai-workspace", 'body[data-room="ai"]', ".ai-share-banner"):
              if marker not in ai_css:
                  raise SystemExit(f"Missing AI Studio style: {marker}")
          for marker in ("api('/api/ai/conversations'", "api('/api/ai/share/'", 'https://www.bing.com/images/create', 'id="aiImageLink"', "server-chat:account-ready"):
              if marker not in ai_js:
                  raise SystemExit(f"Missing AI Studio client feature: {marker}")
          if "POLLINATIONS_API_KEY" in server or "app.post('/api/ai/image'" in server or "api('/api/ai/image'" in ai_js:
              raise SystemExit("Built-in AI image-generation API must remain removed; use the external generator link.")
          if "localStorage.setItem('generatedPassword'" in html or "localStorage.setItem('newPassword'" in html:
              raise SystemExit("Plaintext generated passwords must never be saved to browser storage.")
          PY
      - name: Validate in-chat announcements and admin events
        run: |
          python3 - <<'PY'
          from pathlib import Path
          server = Path("server.js").read_text(encoding="utf-8")
          html = Path("public/index.html").read_text(encoding="utf-8")
          for marker in ("const ANNOUNCEMENT_TTL = 2 * 60 * 1000;", "eventType: options.eventType", "else if (c === 'party')", "else if (c === 'partyoff')"):
              if marker not in server:
                  raise SystemExit(f"Missing two-minute announcement or admin event: {marker}")
          for marker in ("const FLASH_BANNER_MS = 2 * 60 * 1000;", "party-event", "server:party-stop", "PARTY MODE · SERVER EVENT · 2 MINUTES", "Activate Party Mode", "body.party-mode #log", "partyScreenShake", "partyChatDance", "partyConfettiLayer", "i < 24", "prefers-reduced-motion", "function startPartyMode(message)", "function stopPartyMode()", "function layoutAdminDesktop(", "admin-windows-desktop", "admin-desktop-icons", "admin-app-window", "Server Chat · Admin Console", "adminMessageShine", "SERVER ADMIN · OFFICIAL MESSAGE", "const isFlashBanner = !isPinnedInfo && isAnnouncement;", "function refreshAdminLiveMetrics(st)", "five-second poll updates values in place", "z-index:2147483000", "data-admin-desktop-app"):
              if marker not in html:
                  raise SystemExit(f"Missing Windows-like app launcher or stable refresh: {marker}")
          for marker in ("globalAdminAlert", "global-admin-alert", "globalAdminAlertDismiss", "showGlobalAdminAnnouncement"):
              if marker in html:
                  raise SystemExit(f"Floating/dismissible announcement UI must be removed: {marker}")
          PY
      - name: Validate live server center, stickers and chat assistant
        run: |
          python3 - <<'PY'
          from pathlib import Path
          server = Path("server.js").read_text(encoding="utf-8")
          html = Path("public/index.html").read_text(encoding="utf-8")
          status_html = Path("public/status.html").read_text(encoding="utf-8")
          status_js = Path("public/status.js").read_text(encoding="utf-8")
          for marker in ("app.get('/api/server-status'", "function getLiveServerCenterState()", "function getLoadWarnings(load)", "checkServerResourceAlerts", "socket.on('poll:vote'", "function createPoll(room, question, options", "else if (c === 'coin' || c === 'coinflip')", "else if (c === 'help')", "else if (c === 'poll')", "else if (c === 'quiz')", "pollVotes, pollAnswerIndex"):
              if marker not in server:
                  raise SystemExit(f"Missing server status / poll assistant control: {marker}")
          for marker in ("href=\"/status.html\"", 'id="stickerPicker"', "const STICKER_LIBRARY = [", "function renderPollCard(mid, poll)", "socket.on('poll:state'", "socket.on('poll:vote-result'", "function serverCenterWarningsHtml(warnings)", "{ key:'live-center'", "LIVE SERVER CENTER", "function refreshAdminLiveMetrics(st)", "data-picker-sticker"):
              if marker not in html:
                  raise SystemExit(f"Missing sticker library or live status UI: {marker}")
          for marker in ('id="overallStatus"', 'id="warnings"', 'id="channels"', 'id="activity"', 'src="/status.js"', 'Private room activity excluded'):
              if marker not in status_html:
                  raise SystemExit(f"Missing public server status UI: {marker}")
          for marker in ("const API = '/api/server-status'", "setInterval(refresh, 15000)", "function renderWarnings(warnings)", "function renderChannels(channels)", "function renderActivity(activity)"):
              if marker not in status_js:
                  raise SystemExit(f"Missing status page polling / rendering: {marker}")
          if "private-" in status_js or "item.text" in status_js or "username" in status_js:
              raise SystemExit("The public status page must not show private room data, usernames or message text.")
          PY
      - name: Validate Ubuntu COSMIC app redesign
        run: |
          python3 - <<'PY'
          from pathlib import Path
          html = Path("public/index.html").read_text(encoding="utf-8")
          css = Path("public/ubuntu-cosmic.css").read_text(encoding="utf-8")
          ai_css = Path("public/ai.css").read_text(encoding="utf-8")
          status_html = Path("public/status.html").read_text(encoding="utf-8")
          sw = Path("public/sw.js").read_text(encoding="utf-8")
          manifest = Path("public/manifest.webmanifest").read_text(encoding="utf-8")
          if html.find('href="/ubuntu-cosmic.css"') < html.find('href="/accounts.css"'):
              raise SystemExit("The new design stylesheet must load after the legacy styles.")
          for marker in ('class="sidebar-brand"', 'class="sidebar-section-label"', 'class="sidebar-dock"', 'class="sidebar-footer"', 'data-channel="general"', 'href="/status.html"'):
              if marker not in html:
                  raise SystemExit(f"Missing redesigned navigation item: {marker}")
          for marker in ('id="accentPaletteToggle"', 'id="accentPalettePanel"', "const ACCENT_PALETTES =", "localStorage.setItem('chatAccentPalette'"):
              if marker not in html:
                  raise SystemExit(f"Missing local accent theme picker: {marker}")
          for marker in ('html[data-accent="ubuntu"]', 'html[data-accent="arctic"]', 'html[data-accent="matrix"]', 'html[data-accent="rose"]', '--brand-gradient', '.accent-palette-panel'):
              if marker not in css:
                  raise SystemExit(f"Missing selectable accent palette styling: {marker}")
          for marker in ("--ubuntu-orange:#e95420", "--cosmic-purple:#77216f", "#channelNav{", "header::before", ".sidebar-dock", 'body[data-room="ai"] #aiStudioRoot', "@media(max-width:1000px)", "@media(prefers-reduced-motion:reduce)", "body.party-mode #log"):
              if marker not in css:
                  raise SystemExit(f"Missing responsive COSMIC design rule: {marker}")
          for marker in ('body[data-room="ai"] header', ".ai-brand-icon", ".ai-composer-field:focus-within"):
              if marker not in css:
                  raise SystemExit(f"AI Studio is missing the unified visual system: {marker}")
          for marker in ("--bg:#17111c", "--purple:#ff865c", "rgba(119,33,111"):
              if marker not in status_html:
                  raise SystemExit(f"Status page is missing COSMIC colors: {marker}")
          if "server-chat-shell-v4" not in sw or "'/ubuntu-cosmic.css'" not in sw or "'/legal.html'" not in sw or "'/patch-notes.html'" not in sw:
              raise SystemExit("The service worker must cache the updated theme under a new cache version.")
          if '"theme_color": "#77216f"' not in manifest:
              raise SystemExit("PWA theme color does not match the app branding.")
          PY
      - name: Validate web app manifest
        run: node -e "JSON.parse(require('node:fs').readFileSync('public/manifest.webmanifest', 'utf8'))"
      - name: Validate legal consent, bot verification and abuse protection
        run: |
          python3 - <<'PY'
          from pathlib import Path
          server = Path("server.js").read_text(encoding="utf-8")
          html = Path("public/index.html").read_text(encoding="utf-8")
          legal = Path("public/legal.html").read_text(encoding="utf-8")
          css = Path("public/accounts.css").read_text(encoding="utf-8")
          sw = Path("public/sw.js").read_text(encoding="utf-8")
          readme = Path("README.md").read_text(encoding="utf-8")
          for marker in (
              "const proxyaddr = require('proxy-addr');",
              "const SECURITY_MAX_API_REQUESTS = 180;",
              "const SECURITY_MAX_SOCKET_EVENTS = 240;",
              "const SECURITY_MAX_CONNECTIONS = 40;",
              "const SECURITY_BLOCK_MS = 10 * 60 * 1000;",
              "async function verifyTurnstileToken(token)",
              "app.get('/api/security-config'",
              "registration.acceptedTerms !== true",
              "registration.acceptedPrivacy !== true",
              "legalAcceptedAt: Date.now()",
              "if (!allowSocketTraffic(socket))",
          ):
              if marker not in server:
                  raise SystemExit(f"Missing server-side security control: {marker}")
          for marker in (
              'id="authLegalConsent"', 'id="acceptTerms"', 'id="acceptPrivacy"',
              'id="turnstileWidget"', 'id="registrationWebsite"',
              "initRegistrationSecurity()", "https://challenges.cloudflare.com/turnstile/v0/api.js",
              "acceptedTerms:", "acceptedPrivacy:", "termsVersion: securityConfig.termsVersion"
          ):
              if marker not in html:
                  raise SystemExit(f"Missing registration security UI: {marker}")
          for marker in ('id="terms"', 'id="privacy"', "legal name", "client IP", "10 minutes", "Turnstile"):
              if marker.lower() not in legal.lower():
                  raise SystemExit(f"Missing legal/privacy notice detail: {marker}")
          for marker in (".auth-legal-consent", ".auth-consent-line", ".bot-verification-wrap", ".auth-honeypot"):
              if marker not in css:
                  raise SystemExit(f"Missing registration security styling: {marker}")
          if "server-chat-shell-v4" not in sw or "'/legal.html'" not in sw or "'/patch-notes.html'" not in sw:
              raise SystemExit("The legal page must be included in the refreshed service-worker shell.")
          for marker in ("TURNSTILE_SITE_KEY", "TURNSTILE_SECRET_KEY", "10-minute temporary IP block", "application-layer controls"):
              if marker not in readme:
                  raise SystemExit(f"Missing security documentation: {marker}")
          PY
      - name: Validate login proof-of-work, patch notes and UI cleanup
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path
          server = Path("server.js").read_text(encoding="utf-8")
          html = Path("public/index.html").read_text(encoding="utf-8")
          css = Path("public/accounts.css").read_text(encoding="utf-8")
          cosmic_css = Path("public/ubuntu-cosmic.css").read_text(encoding="utf-8")
          sw = Path("public/sw.js").read_text(encoding="utf-8")
          notes = Path("public/patch-notes.html").read_text(encoding="utf-8")
          legal = Path("public/legal.html").read_text(encoding="utf-8")
          for marker in (
              "const SECURITY_TERMS_VERSION = '2026-10-29-v1';",
              "const BOT_IP_APPROVAL_TTL_MS = 10 * 60 * 1000;",
              "const VERIFIED_BOT_IPS = new Map();",
              "const LOGIN_CHALLENGE_TTL_MS = 60 * 1000;",
              "const LOGIN_CHALLENGE_DIFFICULTY_BITS = 12;",
              "const LOGIN_CHALLENGES = new Map();",
              "socket.on('auth:challenge-request'",
              "function verifyLoginChallenge(socket, data)",
              "(digest[1] & 0xf0) === 0",
              "socket.on('auth:challenge-solve'",
              "socket.emit('auth:challenge-approved'",
              "const BOT_IP_APPROVAL_TTL_MS = 10 * 60 * 1000;",
              "const VERIFIED_BOT_IPS = new Map();",
              "if (!isBotIpApproved(socket))",
              "challenge.socketId !== socket.id",
              "challenge.expiresAt <= Date.now()",
              "challenge.address !== authAddress(socket)"
          ):
              if marker not in server:
                  raise SystemExit(f"Missing server-side login security check: {marker}")
          for marker in (
              "async function solveLoginChallenge(challenge)",
              "socket.emit('auth:challenge-request')",
              "socket.emit('auth:challenge-solve'",
              "socket.on('auth:challenge-approved'",
              "socket.emit('auth:register', request.data)",
              "socket.emit('auth:login', request.data)",
              "pendingAuthRequest = null;",
              "A successful check approves this IP for 10 minutes",
              "challengeId: challenge.challengeId",
              'id="loginSecurityHint"',
              'href="/patch-notes.html"',
              'aria-label="Main navigation"',
              'type="button" class="ab ',
              'id="sidebarConnectionDot"',
              "function updateSidebarConnectionStatus(state, label, detail)",
              "updateSidebarConnectionStatus('offline'",
              "updateSidebarConnectionStatus('connecting'",
              "updateSidebarConnectionStatus('maintenance'"
          ):
              if marker not in html:
                  raise SystemExit(f"Missing login or UI cleanup: {marker}")
          if '.sidebar-footer-dot[data-state="offline"]' not in cosmic_css:
              raise SystemExit("The sidebar needs a visible offline connection state.")
          if 'id="empty"' in html:
              raise SystemExit("Unused empty-state IDs should not be present.")
          if ".login-security-hint[hidden]" not in css:
              raise SystemExit("The login security hint must hide correctly in registration mode.")
          if "server-chat-shell-v4" not in sw or "'/patch-notes.html'" not in sw:
              raise SystemExit("The service worker must cache the current patch-note page.")
          for marker in (
              "const cacheKey = url.pathname === '/' || url.pathname === '/index.html'",
              "cache.put(cacheKey, response.clone())",
              "const exactPage = await caches.match(request)",
          ):
              if marker not in sw:
                  raise SystemExit(f"Missing offline navigation cache fix: {marker}")
          for date in ("29 October 2026", "28 October 2026", "27 October 2026"):
              if date not in notes:
                  raise SystemExit(f"Missing dated patch-note entry: {date}")
          if "proof-of-work" not in notes or "not a perfect human detector" not in notes:
              raise SystemExit("Patch notes must accurately describe the login security limitation.")
          if "termsVersion: '2026-10-29-v1'" not in html:
              raise SystemExit("The registration client must use the latest terms version.")
          if "Last updated: 29 October 2026 · Version 2026-10-29-v1" not in legal:
              raise SystemExit("The privacy notice date/version must match the current terms version.")
          if "marks the client IP as verified for up to 10 minutes" not in legal:
              raise SystemExit("The privacy notice must disclose temporary IP verification.")
          static_html = html.split("<script", 1)[0]
          ids = re.findall(r'id="([^"]+)"', static_html, flags=re.I)
          duplicates = sorted({item for item in ids if ids.count(item) > 1})
          if duplicates:
              raise SystemExit(f"Duplicate static HTML IDs found: {duplicates}")
          PY
