name: Validate application

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate server and service worker syntax
        run: |
          node --check server.js
          node --check public/sw.js
          node --check public/ai.js
      - name: Validate inline browser JavaScript
        shell: bash
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path
          html = Path("public/index.html").read_text(encoding="utf-8")
          scripts = re.findall(r'<script\b(?![^>]*\bsrc=)[^>]*>(.*?)</script\s*>', html, flags=re.I | re.S)
          if not scripts:
              raise SystemExit("No inline JavaScript block was found.")
          Path("/tmp/server-chat-inline.js").write_text("\n".join(scripts), encoding="utf-8")
          PY
          node --check /tmp/server-chat-inline.js
      - name: Validate temporary account wiring
        run: |
          python3 - <<'PY'
          from pathlib import Path
          server = Path("server.js").read_text(encoding="utf-8")
          html = Path("public/index.html").read_text(encoding="utf-8")
          css = Path("public/accounts.css").read_text(encoding="utf-8")
          for marker in ("socket.on('auth:register'", "socket.on('auth:login'", "socket.on('auth:resume'", "socket.on('auth:logout'", "socket.use((packet, next)"):
              if marker not in server:
                  raise SystemExit(f"Missing server account control: {marker}")
          for marker in ('id="authGate"', 'id="authForm"', 'id="authPasswordConfirm"', 'id="logoutBtn"', 'id="accountName"'):
              if marker not in html:
                  raise SystemExit(f"Missing account UI control: {marker}")
          for marker in (".auth-card", "#channelNav", ".account-chip"):
              if marker not in css:
                  raise SystemExit(f"Missing account/workspace style: {marker}")
          PY
      - name: Validate web app manifest
        run: node -e "JSON.parse(require('node:fs').readFileSync('public/manifest.webmanifest', 'utf8'))"
