<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#5667e8"><title>Server Chat · Offline</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;font:16px/1.6 system-ui,sans-serif;color:#eaf0fb;background:#0e121b}
main{width:min(460px,100%);padding:32px;border:1px solid #293448;border-radius:24px;background:#151b27;box-shadow:0 24px 80px #0005;text-align:center}
.icon{display:grid;place-items:center;margin:0 auto 20px;width:64px;height:64px;border-radius:20px;background:linear-gradient(145deg,#6979f5,#35b7b2);font-size:28px;font-weight:900}
h1{margin:0 0 8px;font-size:24px;letter-spacing:-.04em}p{margin:0 0 22px;color:#aab5c8}
button{padding:11px 16px;border:0;border-radius:12px;background:#6273ef;color:#fff;font:inherit;font-weight:750;cursor:pointer}
</style></head>
<body><main><div class="icon">✦</div><h1>You’re offline</h1><p>Server Chat needs an internet connection for messages. Once you're back online, reconnect to continue chatting.</p><button onclick="location.reload()">Try again</button></main></body></html>
