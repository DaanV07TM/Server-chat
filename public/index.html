<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Anoniem chatten</title>
<style>
:root{--bg:#e9edf3;--panel:#fff;--ink:#16202e;--mute:#6b7788;--accent:#2f4bd8;--mine:#2f4bd8;--mine-ink:#fff;--other:#fff;--line:#d5dbe5;--l:38%}
@media (prefers-color-scheme:dark){:root{--bg:#10151d;--panel:#171d28;--ink:#e8edf5;--mute:#8d99ab;--accent:#7b93ff;--mine:#4b63e0;--other:#1e2633;--line:#27303f;--l:72%}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font:16px/1.4 system-ui,-apple-system,Segoe UI,sans-serif;background:var(--bg);color:var(--ink);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0);padding-bottom:env(safe-area-inset-bottom,0)}
header{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;padding:12px 16px;background:var(--panel);border-bottom:1px solid var(--line)}
header h1{font-size:17px;margin:0;flex:1}
header small{color:var(--mute)}
header button{border:1px solid var(--line);background:none;color:var(--ink);border-radius:8px;padding:6px 10px;font:inherit;font-size:14px}
#log{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:8px}
.m{max-width:min(80%,520px);padding:8px 12px;border-radius:14px;background:var(--other);border:1px solid var(--line);overflow-wrap:anywhere}
.m b{display:block;font-size:12px;margin-bottom:2px}
.m img{display:block;max-width:100%;max-height:300px;border-radius:10px;margin-top:4px}
.m.me{align-self:flex-end;background:var(--mine);color:var(--mine-ink);border-color:transparent}
.m.me b{color:rgba(255,255,255,.75)}
.m.bot{align-self:center;background:none;border:1px dashed var(--line);color:var(--mute);font-size:14px}
.empty{margin:auto;color:var(--mute);text-align:center;max-width:260px}
#typing{height:20px;padding:0 16px;font-size:13px;color:var(--mute)}
#game{display:none;padding:10px 16px;background:var(--panel);border-top:1px solid var(--line)}
#game.open{display:block}
#grid{display:grid;grid-template-columns:repeat(3,64px);gap:6px;margin:8px 0}
#grid button{height:64px;font-size:28px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink)}
#bar{display:flex;gap:8px;padding:10px 12px;background:var(--panel);border-top:1px solid var(--line)}
#bar .icon{border:1px solid var(--line);background:none;border-radius:50%;width:42px;font-size:18px}
#text{flex:1;min-width:0;border:1px solid var(--line);border-radius:20px;padding:10px 14px;font:inherit;background:var(--bg);color:var(--ink)}
#send{border:0;border-radius:20px;background:var(--accent);color:#fff;padding:0 18px;font:inherit;font-weight:600}
@media (prefers-color-scheme:dark){#send{color:#10151d}}
button:focus-visible,#text:focus{outline:2px solid var(--accent);outline-offset:1px}
</style>
</head>
<body>
<header>
  <h1 id="title">Chat</h1>
  <small id="online"></small>
  <button id="share" type="button">Link kopiëren</button>
  <button id="private" type="button">Nieuwe privékamer</button>
  <button id="rename" type="button">Naam</button>
</header>
<div id="log"></div>
<div id="typing" aria-live="polite"></div>
<div id="game">
  <strong>Boter-kaas-en-eieren</strong>
  <div id="gstatus"></div>
  <div id="grid"></div>
  <button id="greset" type="button">Opnieuw</button>
</div>
<div id="bar">
  <input id="file" type="file" accept="image/*" hidden>
  <button class="icon" id="photo" type="button" aria-label="Foto of GIF sturen">📎</button>
  <button class="icon" id="gamebtn" type="button" aria-label="Spel openen">🎮</button>
  <input id="text" maxlength="500" placeholder="Typ een bericht (of /dobbel)" autocomplete="off" aria-label="Bericht">
  <button id="send" type="button">Stuur</button>
</div>
<script src="/socket.io/socket.io.js"></script>
<script>
const $ = id => document.getElementById(id);
const EMPTY = '<p class="empty" id="empty">Nog niets hier. Schrijf het eerste bericht. Berichten verdwijnen na 1 uur.</p>';
const params = new URLSearchParams(location.search);
const room = (params.get('room') || 'algemeen').toLowerCase().replace(/[^a-z0-9-_]/g,'').slice(0,30) || 'algemeen';
let name = null;
try { name = sessionStorage.getItem('name'); } catch(e){}
if (!name) {
  name = 'Anoniem-' + Math.random().toString(36).slice(2,6);
  try { sessionStorage.setItem('name', name); } catch(e){}
}
$('title').textContent = '#' + room;
const log = $('log'), text = $('text'), socket = io();
log.innerHTML = EMPTY;
socket.on('connect', () => socket.emit('join', room));

const hue = s => { let h = 0; for (const c of s) h = (h * 31 + c.charCodeAt(0)) % 360; return h; };
const down = () => { log.scrollTop = log.scrollHeight; };

function add(m){
  const e = $('empty'); if (e) e.remove();
  const d = document.createElement('div');
  d.className = 'm' + (m.bot ? ' bot' : m.id === socket.id ? ' me' : '');
  if (!m.bot) {
    const b = document.createElement('b'); b.textContent = m.name;
    if (m.id !== socket.id) b.style.color = 'hsl(' + hue(m.name) + ' 60% var(--l))';
    d.append(b);
  }
  if (m.text) { const p = document.createElement('span'); p.textContent = m.text; d.append(p); }
  if (m.img) { const i = document.createElement('img'); i.alt = 'Afbeelding'; i.onload = down; i.src = m.img; d.append(i); }
  log.append(d); down();
}
socket.on('history', l => { log.innerHTML = l.length ? '' : EMPTY; l.forEach(add); });
socket.on('msg', m => { add(m); $('typing').textContent = ''; });
socket.on('online', n => $('online').textContent = n + ' online');

function send(img){
  const t = text.value.trim();
  if (!t && !img) return;
  socket.emit('msg', { name, text: t, img });
  text.value = '';
}
$('send').onclick = () => send();
text.addEventListener('keydown', e => { if (e.key === 'Enter') send(); });

// typt...
let lt = 0, tt;
text.addEventListener('input', () => { const n = Date.now(); if (n - lt > 2000) { lt = n; socket.emit('typing', name); } });
socket.on('typing', n => { $('typing').textContent = n + ' typt…'; clearTimeout(tt); tt = setTimeout(() => $('typing').textContent = '', 2500); });

// foto's en GIFs (foto's worden verkleind; daarbij verdwijnt ook locatie-info)
$('photo').onclick = () => $('file').click();
$('file').onchange = e => {
  const f = e.target.files[0]; e.target.value = '';
  if (!f) return;
  if (f.type === 'image/gif') {
    if (f.size > 900000) return alert('Deze GIF is te groot (max 900 KB).');
    const r = new FileReader(); r.onload = () => send(r.result); r.readAsDataURL(f); return;
  }
  if (!f.type.startsWith('image/')) return alert('Alleen afbeeldingen en GIFs.');
  const url = URL.createObjectURL(f), im = new Image();
  im.onload = () => {
    const k = Math.min(1, 800 / Math.max(im.width, im.height));
    const c = document.createElement('canvas');
    c.width = Math.round(im.width * k); c.height = Math.round(im.height * k);
    c.getContext('2d').drawImage(im, 0, 0, c.width, c.height);
    URL.revokeObjectURL(url);
    send(c.toDataURL('image/jpeg', .75));
  };
  im.onerror = () => alert('Deze afbeelding kan niet geladen worden.');
  im.src = url;
};

// boter-kaas-en-eieren
let G = null;
$('gamebtn').onclick = () => { if ($('game').classList.toggle('open')) socket.emit('game:open'); };
$('greset').onclick = () => socket.emit('game:reset');
socket.on('game', g => { G = g; draw(); });
function draw(){
  const me = G.p.X === socket.id ? 'X' : G.p.O === socket.id ? 'O' : null;
  $('grid').innerHTML = '';
  G.b.forEach((v, i) => {
    const b = document.createElement('button');
    b.textContent = v; b.setAttribute('aria-label', 'Vak ' + (i + 1));
    b.onclick = () => socket.emit('game:move', i);
    $('grid').append(b);
  });
  $('gstatus').textContent = G.w ? (G.w === 'gelijk' ? 'Gelijkspel' : G.w + ' wint!')
    : (!G.p.X || !G.p.O) ? 'Wachten op een tweede speler…'
    : !me ? 'Je kijkt mee'
    : G.turn === me ? 'Jouw beurt (' + me + ')' : 'Beurt van de tegenstander';
}

$('rename').onclick = () => {
  const n = prompt('Kies een naam (max 20 tekens)', name);
  if (n && n.trim()) { name = n.trim().slice(0, 20); try { sessionStorage.setItem('name', name); } catch(e){} }
};
$('private').onclick = () => {
  const a = new Uint8Array(9); crypto.getRandomValues(a);
  location.href = '/?room=prive-' + Array.from(a, x => (x % 36).toString(36)).join('');
};
$('share').onclick = async (ev) => {
  try { await navigator.clipboard.writeText(location.origin + '/?room=' + room); ev.target.textContent = 'Gekopieerd'; }
  catch(e) { ev.target.textContent = 'Kopiëren mislukt'; }
  setTimeout(() => ev.target.textContent = 'Link kopiëren', 2000);
};
if (room !== 'algemeen') $('online').insertAdjacentHTML('afterend', '<a href="/" style="color:var(--accent);font-size:14px">Naar algemeen</a>');
</script>
</body>
</html
