<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Anoniem chatten</title>
<style>
:root{--bg:#e9edf3;--panel:#fff;--ink:#16202e;--mute:#6b7788;--accent:#2f4bd8;--mine:#2f4bd8;--mine-ink:#fff;--other:#fff;--line:#d5dbe5}
@media (prefers-color-scheme:dark){:root{--bg:#10151d;--panel:#171d28;--ink:#e8edf5;--mute:#8d99ab;--accent:#7b93ff;--mine:#4b63e0;--mine-ink:#fff;--other:#1e2633;--line:#27303f}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font:16px/1.4 system-ui,-apple-system,Segoe UI,sans-serif;background:var(--bg);color:var(--ink);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0);padding-bottom:env(safe-area-inset-bottom,0)}
header{display:flex;align-items:center;gap:12px;padding:12px 16px;background:var(--panel);border-bottom:1px solid var(--line)}
header h1{font-size:17px;margin:0;flex:1}
header small{color:var(--mute)}
#share{border:1px solid var(--line);background:none;color:var(--ink);border-radius:8px;padding:6px 10px;font:inherit;font-size:14px}
#log{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:8px}
.m{max-width:min(80%,520px);padding:8px 12px;border-radius:14px;background:var(--other);border:1px solid var(--line);word-wrap:break-word;overflow-wrap:anywhere}
.m b{display:block;font-size:12px;color:var(--mute);margin-bottom:2px}
.m.me{align-self:flex-end;background:var(--mine);color:var(--mine-ink);border-color:transparent}
.m.me b{color:rgba(255,255,255,.75)}
.empty{margin:auto;color:var(--mute);text-align:center;max-width:260px}
#bar{display:flex;gap:8px;padding:10px 12px;background:var(--panel);border-top:1px solid var(--line)}
#text{flex:1;border:1px solid var(--line);border-radius:20px;padding:10px 14px;font:inherit;background:var(--bg);color:var(--ink)}
#text:focus,#share:focus,#send:focus{outline:2px solid var(--accent);outline-offset:1px}
#send{border:0;border-radius:20px;background:var(--accent);color:#fff;padding:0 18px;font:inherit;font-weight:600}
@media (prefers-color-scheme:dark){#send{color:#10151d}}
</style>
</head>
<body>
<header>
  <h1 id="title">Chat</h1>
  <small id="online"></small>
  <button id="share" type="button">Link kopiëren</button>
</header>
<div id="log"><p class="empty" id="empty">Nog niets hier. Schrijf het eerste bericht. Berichten verdwijnen na 1 uur.</p></div>
<div id="bar">
  <input id="text" maxlength="500" placeholder="Typ een bericht" autocomplete="off" aria-label="Bericht">
  <button id="send" type="button">Stuur</button>
</div>
<script src="/socket.io/socket.io.js"></script>
<script>
const params = new URLSearchParams(location.search);
const room = (params.get('room') || 'algemeen').toLowerCase().replace(/[^a-z0-9-_]/g,'').slice(0,30) || 'algemeen';
let name = null;
try { name = sessionStorage.getItem('name'); } catch(e){}
if (!name) {
  name = 'Anoniem-' + Math.random().toString(36).slice(2,6);
  try { sessionStorage.setItem('name', name); } catch(e){}
}
document.getElementById('title').textContent = '#' + room;

const log = document.getElementById('log');
const text = document.getElementById('text');
const socket = io();
socket.on('connect', () => socket.emit('join', room));

function add(m){
  const e = document.getElementById('empty'); if (e) e.remove();
  const d = document.createElement('div');
  d.className = 'm' + (m.name === name ? ' me' : '');
  const b = document.createElement('b'); b.textContent = m.name;
  const p = document.createElement('span'); p.textContent = m.text;
  d.append(b, p); log.append(d);
  log.scrollTop = log.scrollHeight;
}
socket.on('history', (list) => { log.innerHTML = ''; if (!list.length) log.innerHTML = '<p class="empty" id="empty">Nog niets hier. Schrijf het eerste bericht. Berichten verdwijnen na 1 uur.</p>'; list.forEach(add); });
socket.on('msg', add);
socket.on('online', (n) => document.getElementById('online').textContent = n + ' online');

function send(){
  const t = text.value.trim(); if (!t) return;
  socket.emit('msg', { name, text: t }); text.value = '';
}
document.getElementById('send').onclick = send;
text.addEventListener('keydown', e => { if (e.key === 'Enter') send(); });
document.getElementById('share').onclick = async (ev) => {
  try { await navigator.clipboard.writeText(location.origin + '/?room=' + room); ev.target.textContent = 'Gekopieerd'; }
  catch(e) { ev.target.textContent = 'Kopiëren mislukt'; }
  setTimeout(() => ev.target.textContent = 'Link kopiëren', 2000);
};
</script>
</body>
</html>
